name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer analyse -- --memory-limit=1G

      - name: Tests, plus the shared gateway vectors
        run: composer test

      - name: The package must require no Composer dependencies
        # A requirement here lands in every consuming application's lock file.
        # Extensions are fine; packages are not.
        run: |
          php -r '
            $r = json_decode(file_get_contents("composer.json"), true)["require"];
            $pkgs = array_filter(array_keys($r), fn ($k) => $k !== "php" && !str_starts_with($k, "ext-"));
            if ($pkgs) { fwrite(STDERR, "dependencies appeared: " . implode(", ", $pkgs) . "\n"); exit(1); }
            echo "no package dependencies\n";
          '

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Conformance
        run: |
          npm --prefix contract/harness install
          npm --prefix contract/harness run conformance php
